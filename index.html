<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Theater Sound Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <button class="settings-btn" id="settingsBtn">⚙️</button>
        </header>

        <!-- Buttons are rendered from the config (app.js) -->
        <div class="buttons-grid" id="buttonsGrid"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Einstellungen</h2>
                <button class="close-btn" id="closeBtn">✕</button>
            </div>
            <div class="modal-body">
                <!-- One card per song, rendered from the config (app.js) -->
                <div id="cardList"></div>

                <div class="upload-zone" id="uploadZone">
                    <p>Song hinzufügen</p>
                    <label class="upload-btn">Datei auswählen
                        <input type="file" id="fileInput" accept="audio/*,.mp3,.mpeg,.m4a,.wav,.ogg,.aac" multiple hidden>
                    </label>
                    <p class="upload-hint">oder Datei hierher ziehen</p>
                </div>

                <button class="save-btn" id="saveBtn">💾 Speichern</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
