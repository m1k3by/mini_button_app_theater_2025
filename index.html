<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Theater Sound Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <button class="settings-btn" id="settingsBtn">⚙️</button>
        </header>

        <div class="buttons-grid" id="buttonsGrid">
            <button class="sound-btn" data-sound="1">
                <span class="btn-label" id="label1">Sound 1</span>
            </button>
            <button class="sound-btn" data-sound="2">
                <span class="btn-label" id="label2">Sound 2</span>
            </button>
            <button class="sound-btn" data-sound="3">
                <span class="btn-label" id="label3">Sound 3</span>
            </button>
            <button class="sound-btn" data-sound="4">
                <span class="btn-label" id="label4">Sound 4</span>
            </button>
            <button class="sound-btn" data-sound="5">
                <span class="btn-label" id="label5">Sound 5</span>
            </button>
            <button class="sound-btn" data-sound="6">
                <span class="btn-label" id="label6">Sound 6</span>
            </button>
            <button class="sound-btn" data-sound="7">
                <span class="btn-label" id="label7">Sound 7</span>
            </button>
            <button class="sound-btn" data-sound="8">
                <span class="btn-label" id="label8">Sound 8</span>
            </button>
            <button class="sound-btn" data-sound="9">
                <span class="btn-label" id="label9">Sound 9</span>
            </button>
            <button class="sound-btn" data-sound="10">
                <span class="btn-label" id="label10">Sound 10</span>
            </button>        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Einstellungen</h2>
                <button class="close-btn" id="closeBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">1</span></div>
                    <label for="sound1-name">Name:</label>
                    <input type="text" id="sound1-name" placeholder="Sound 1">
                    
                    <label for="sound1-url">URL:</label>
                    <input type="url" id="sound1-url" placeholder="https://...">
                    
                    <label for="sound1-start">Startzeit: <span id="sound1-time">0:00</span></label>
                    <input type="range" id="sound1-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">2</span></div>

                    <label for="sound2-url">URL:</label>
                    <input type="url" id="sound2-url" placeholder="https://...">
                    
                    <label for="sound2-start">Startzeit: <span id="sound2-time">0:00</span></label>
                    <input type="range" id="sound2-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">3</span></div>
                    <label for="sound3-name">Name:</label>
                    <input type="text" id="sound3-name" placeholder="Sound 3">
                    
                    <label for="sound3-url">URL:</label>
                    <input type="url" id="sound3-url" placeholder="https://...">
                    
                    <label for="sound3-start">Startzeit: <span id="sound3-time">0:00</span></label>
                    <input type="range" id="sound3-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">4</span></div>
                    <label for="sound4-name">Name:</label>

                    <label for="sound4-url">URL:</label>

                    <label for="sound4-start">Startzeit: <span id="sound4-time">0:00</span></label>
                    <input type="range" id="sound4-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">5</span></div>
                    <label for="sound5-name">Name:</label>
                    <input type="text" id="sound5-name" placeholder="Sound 5">

                    <label for="sound5-url">URL:</label>
                    <input type="url" id="sound5-url" placeholder="https://...">

                    <label for="sound5-start">Startzeit: <span id="sound5-time">0:00</span></label>
                    <input type="range" id="sound5-start" value="0" min="0" max="300" step="0.5">
                </div>

                    <input type="range" id="sound6-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">7</span></div>
                    <label for="sound7-name">Name:</label>
                    <input type="text" id="sound7-name" placeholder="Sound 7">

                    <label for="sound7-url">URL:</label>
                    <input type="url" id="sound7-url" placeholder="https://...">

                    <label for="sound7-start">Startzeit: <span id="sound7-time">0:00</span></label>
                    <input type="range" id="sound7-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">8</span></div>
                    <label for="sound8-name">Name:</label>
                    <input type="text" id="sound8-name" placeholder="Sound 8">

                    <input type="range" id="sound8-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">9</span></div>
                    <label for="sound9-name">Name:</label>

                    <input type="range" id="sound9-start" value="0" min="0" max="300" step="0.5">
                </div>

                <div class="setting-group">
                    <div class="drag-head"><span class="drag-handle" title="Ziehen zum Verschieben">⠿</span><span class="drag-num">10</span></div>
                    <label for="sound10-name">Name:</label>
                    <input type="text" id="sound10-name" placeholder="Sound 10">

                    <label for="sound10-url">URL:</label>
                    <input type="url" id="sound10-url" placeholder="https://...">

                    <label for="sound10-start">Startzeit: <span id="sound10-time">0:00</span></label>
                    <input type="range" id="sound10-start" value="0" min="0" max="300" step="0.5">
                </div>
                <button class="save-btn" id="saveBtn">💾 Speichern</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
